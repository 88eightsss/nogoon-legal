<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<meta name="referrer" content="no-referrer"/>
<title>Open in Sidestreet</title>
<style>
:root{--bg:#F3F4F1;--surface:#FFFFFF;--text:#1C1F23;--muted:#5F6368;--accent:#1A73E8;--border:#E2E4E0}
@media (prefers-color-scheme: dark){:root{--bg:#121416;--surface:#1E2124;--text:#E8EAED;--muted:#9AA0A6;--accent:#8AB4F8;--border:#2E3236}}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px 22px;text-align:center}
h1{font-size:1.5rem;margin-bottom:8px}
p{color:var(--muted);font-size:.98rem;margin-bottom:20px}
.btn{display:block;width:100%;height:54px;line-height:54px;border-radius:27px;background:var(--accent);color:#fff;font-weight:700;font-size:1.05rem;text-decoration:none}
@media (prefers-color-scheme: dark){.btn{color:#121416}}
.code{margin:22px 0 6px;font-size:1.4rem;font-weight:800;letter-spacing:.12em}
.small{font-size:.86rem;color:var(--muted);margin:0}
.hide{display:none}
</style>
</head>
<body>
<main class="card">
  <h1 id="title">Open in Sidestreet</h1>
  <p id="lead">Tap below to open it in the app.</p>
  <a id="open" class="btn" href="#">Open in Sidestreet</a>
  <div id="codebox" class="hide">
    <div class="code" id="code"></div>
    <p class="small" id="codehint">If the button does not work, open the app, go to Make, then Visit a page, and type this code. It works once.</p>
  </div>
  <p id="bad" class="small hide" style="margin-top:16px">This link looks incomplete. Ask the person who sent it for a new one.</p>
</main>
<script>
// Opens an invite (?i=), a host invite (?h=) or a page (?p=) in the Sidestreet app (Android package com.nogoon.app, scheme nogoon://).
// Nothing is stored or sent anywhere; this page only reads its own link.
(function () {
  var q = new URLSearchParams(location.search);
  var code = (q.get('i') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  var page = (q.get('p') || '').toLowerCase();
  var host = (q.get('h') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  var path = null;
  if (host.length >= 8 && host.length <= 16) {
    path = 'host/' + host;
    document.getElementById('title').textContent = 'Host on Sidestreet';
    document.getElementById('lead').textContent = 'You are invited to host volunteer days or meetups on Sidestreet.';
    document.getElementById('code').textContent = host.replace(/(.{4})(?=.)/g, '$1-');
    document.getElementById('codehint').textContent = 'If the button does not work, open the app, go to Make, then Become a host, and type this code. It works once.';
    document.getElementById('codebox').className = '';
  } else if (code.length >= 8 && code.length <= 16) {
    path = 'invite/' + code;
    document.getElementById('title').textContent = 'You are invited';
    document.getElementById('lead').textContent = 'Someone invited you to see their page on Sidestreet.';
    document.getElementById('code').textContent = code.replace(/(.{4})(?=.)/g, '$1-');
    document.getElementById('codebox').className = '';
  } else if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(page)) {
    path = 'page/' + page;
    document.getElementById('lead').textContent = 'Someone shared their page on Sidestreet with you.';
  }
  var btn = document.getElementById('open');
  if (!path) {
    btn.className = 'btn hide';
    document.getElementById('bad').className = 'small';
    return;
  }
  var store = 'https://play.google.com/store/apps/details?id=com.nogoon.app';
  var isAndroid = /Android/i.test(navigator.userAgent);
  btn.href = isAndroid
    ? 'intent://' + path + '#Intent;scheme=nogoon;package=com.nogoon.app;S.browser_fallback_url=' + encodeURIComponent(store) + ';end'
    : 'nogoon://' + path;
})();
</script>
</body>
</html>
